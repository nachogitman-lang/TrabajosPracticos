<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    
<nav>
        
    <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../pages/alta.html">Alta</a></li>
        <li><a href="../pages/contacto.html">Contacto</a></li>
        <li><a href="../pages/nosotros.html">Nosotros</a></li>
    </ul>
</nav>


<div class="centered">

    <form class="nuevoform" id="formulario" novalidate>
        <fieldset>

            <label for="nombre">Nombre del jugete:</label>
            <input type="text" id="nombre" name="nombre" required>
            
        <label for="descripcion">Descripción corta:</label>
        <input type="text" id="descripcion" name="descripcion" required>
        
        <label for="precio">Precio:</label>
        <input type="number" id="precio" name="precio" required step="0.01" min="0" >
        
        <label for="marca">marca:</label>
        <input type="text" id="marca" name="marca" required>
        <label for="categoria">categoria:</label>
        <input type="text" id="categoria" name="categoria" required>
        <label for="descripcion_larga">descripcion larga:</label>
        <input type="text" id="descripcion_larga" name="descripcion_larga" required>
        <label for="envio">envio sin cargo </label>
        <select name="confirmacion" id="confirmacion">
            <option value="si">Sí</option>
            <option value="no">No</option>
        </select>
        <label for="edad_desde">edad desde:</label>
        <input type="number" id="edad_desde" name="edad_desde" required min="0">
        <label for="edad_hasta">edad hasta:</label>
        <input type="number" id="edad_hasta" name="edad_hasta" required min="0">
        <label for="foto"> foto</label>
        <input type="file" id="foto" name="foto" required>
        
        <button type="submit">Agregar Jugete</button>
    </form>
</fieldset>
    
</div>













<script src="../js/alta.js"></script>

</footer>
</body>
</html>
